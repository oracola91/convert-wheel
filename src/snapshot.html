<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snapshot</title>
  <link rel="stylesheet" href="editor.css">
  <script src="snapshot.js" defer></script>
</head>
<body>
  <main>
    <section id="stage" class="snapshot">
      <img id="frame" alt="The frame at the chosen moment">
    </section>
    <section id="panel">
      <input id="moment" type="range" min="0" step="40" aria-label="Moment">
      <p id="hint"></p>
      <p id="problem" role="alert" hidden></p>
    </section>
    <footer>
      <div class="end">
        <button type="button" id="cancel">Cancel</button>
        <button type="button" id="apply" class="primary">Save Picture</button>
      </div>
    </footer>
  </main>
</body>
</html>
