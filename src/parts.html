<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split</title>
  <link rel="stylesheet" href="editor.css">
  <script src="parts.js" defer></script>
</head>
<body>
  <main>
    <section id="panel">
      <p id="what"></p>
      <label id="counts-label">Into equal parts</label>
      <div id="counts" class="group" role="group" aria-labelledby="counts-label"></div>
      <label id="lengths-label">Or parts of</label>
      <div id="lengths" class="group" role="group" aria-labelledby="lengths-label"></div>
      <p id="hint"></p>
      <p id="problem" role="alert" hidden></p>
    </section>
    <footer>
      <div class="end">
        <button type="button" id="cancel">Cancel</button>
        <button type="button" id="apply" class="primary">Split</button>
      </div>
    </footer>
  </main>
</body>
</html>
