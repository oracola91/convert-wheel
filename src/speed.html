<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speed</title>
  <link rel="stylesheet" href="editor.css">
  <script src="speed.js" defer></script>
</head>
<body>
  <main>
    <section id="panel">
      <p id="what"></p>
      <div id="speeds" class="group" role="group" aria-label="Speed"></div>
      <p id="hint"></p>
      <p id="problem" role="alert" hidden></p>
    </section>
    <footer>
      <div class="end">
        <button type="button" id="cancel">Cancel</button>
        <button type="button" id="apply" class="primary">Change Speed</button>
      </div>
    </footer>
  </main>
</body>
</html>
