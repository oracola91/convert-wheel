<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Info</title>
  <link rel="stylesheet" href="editor.css">
  <script src="info.js" defer></script>
</head>
<body>
  <main>
    <section id="panel" class="scroll">
      <p id="what"></p>
      <dl id="facts"></dl>
      <div id="fields"></div>
      <p id="hint"></p>
      <p id="problem" role="alert" hidden></p>
    </section>
    <footer>
      <div class="end">
        <button type="button" id="cancel">Cancel</button>
        <button type="button" id="apply" class="primary">Save</button>
      </div>
    </footer>
  </main>
</body>
</html>
