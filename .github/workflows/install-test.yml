# Runs scripts/install-linux.sh on clean Ubuntu 22.04 and 24.04 machines whenever the
# script changes, and once a week, so a release, a package or a download that stops
# working shows up. It installs the newest release (checking its signature); a GNOME
# settings store stands in for the desktop, so the keyboard shortcut is checked too,
# next to a shortcut that was there before. The script runs again with the installed
# version named, as people will run it twice, and the installed app then converts
# through each tool from the command line (PDFs once the release has PDF input).
name: Linux setup script

on:
  pull_request:
    paths:
      - scripts/install-linux.sh
      - .github/workflows/install-test.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Setup script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: A GNOME settings store, for the shortcut
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus dconf-service dconf-gsettings-backend gnome-settings-daemon-common

      - name: Run the setup script twice and check what it set
        env:
          XDG_CURRENT_DESKTOP: ubuntu:GNOME
        run: |
          cat > "$RUNNER_TEMP/check.sh" <<'EOF'
          set -eu
          keys=org.gnome.settings-daemon.plugins.media-keys
          mine=/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/pirouette/
          theirs=/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/
          gsettings set $keys custom-keybindings "['$theirs']"
          # The program the setup put in Open at Login, and the package it came in.
          app() { sed -n 's/^Exec="\(.*\)"$/\1/p' "$HOME/.config/autostart/pirouette.desktop"; }
          installed() { dpkg-query -W -f='${Version}' "$(dpkg-query -S "$(app)" | cut -d: -f1)"; }
          sh scripts/install-linux.sh
          # A key the user picked must survive a second run.
          gsettings set $keys.custom-keybinding:$mine binding '<Super>w'
          sh scripts/install-linux.sh "$(installed)"
          gsettings get $keys custom-keybindings
          [ "$(gsettings get $keys custom-keybindings)" = "['$theirs', '$mine']" ]
          [ "$(gsettings get $keys.custom-keybinding:$mine command)" = "'$(app) --show'" ]
          [ "$(gsettings get $keys.custom-keybinding:$mine binding)" = "'<Super>w'" ]
          [ -x "$(app)" ]
          pandoc --version | head -n 1
          command -v mutool
          EOF
          dbus-run-session -- sh "$RUNNER_TEMP/check.sh"

      - name: The installed app converts
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          app=$(sed -n 's/^Exec="\(.*\)"$/\1/p' "$HOME/.config/autostart/pirouette.desktop")
          convert -size 64x48 xc:orange in.png
          printf '# Title\n\nSome *text*.\n' > notes.md
          "$app" --convert jpg "$PWD/in.png"
          "$app" --convert docx "$PWD/notes.md"
          "$app" --convert html "$PWD/notes.md"
          "$app" --convert pdf "$PWD/notes.docx"
          file in.jpg notes.docx notes.html notes.pdf
          file in.jpg | grep -q JPEG
          head -c 2 notes.docx | grep -q PK
          grep -q '<h1' notes.html
          head -c 5 notes.pdf | grep -q '%PDF-'
          version=$(dpkg-query -W -f='${Version}' "$(dpkg-query -S "$app" | cut -d: -f1)")
          if dpkg --compare-versions "$version" ge 0.2.0; then
            "$app" --convert png "$PWD/notes.pdf"
            "$app" --convert txt "$PWD/notes.pdf"
            file notes.png | grep -q PNG
            grep -q 'Some text' notes.txt
          else
            echo "Pirouette $version has no PDF input yet: PDF conversion not tested"
          fi
