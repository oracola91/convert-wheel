# Builds the Windows installers and the Linux packages.
#
# - Pushing a version tag (v0.2.0, ...) builds both and publishes a GitHub Release
#   with every installer attached, plus latest.json: the file the app's updater reads.
#   The tag must match the version in tauri.conf.json. The release starts as a draft,
#   so installed copies don't see it yet; scripts/release-macos.sh adds the macOS files
#   from a Mac and then publishes it.
# - Update files are signed with the project's update key, with the version recorded
#   in the signature; the app checks both before it installs anything. The key lives
#   in the "release" environment, which only v* tags can use, and only the release
#   job's signing step sees it: the builds themselves never do.
# - Actions > Build > Run workflow (or `gh workflow run build.yml -f platform=linux`)
#   builds without releasing; the files stay on the run page for 14 days.
#
# Ordinary pushes build nothing here, so build minutes are spent only when asked.
# (test.yml runs the unit tests on pull requests.)
# Actions are pinned to exact commits; the comment names the release. All of them
# run on Node.js 24 (GitHub retired Node.js 20 for actions).
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Which system to build for
        type: choice
        options: [both, windows, linux]
        default: both

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name == 'push' || inputs.platform != 'linux'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1

      # Not for release builds: a cache from a branch build must not end up in a release.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name != 'push'
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: npm ci --ignore-scripts

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked

      # The .exe installs for the signed-in user without admin rights; the .msi installs
      # for all users in Program Files, the form Intune and other management tools expect.
      - name: Build the installers
        run: npx --no-install tauri build --bundles nsis,msi -- --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pirouette-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14

      # Up to 0.3.x the app had another name, folder and program file on Windows
      # (src-tauri/src/migrate.rs). This build must take that copy's place: installed
      # as an update (/UPDATE, what the app's own updater does) and by hand, the old
      # copy goes, Open at Login and the Start menu entry come back under the new name,
      # the settings stay (in the old folder until the app moves them on its start).
      - name: Check the move from 0.2.1 to this build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v0.2.1 -R $env:GITHUB_REPOSITORY -p 'Convert.Wheel_0.2.1_x64-setup.exe' -D old
          $new = (Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1).FullName
          $old = (Resolve-Path old\Convert.Wheel_0.2.1_x64-setup.exe).Path
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $uninst = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $oldDir = Join-Path $env:LOCALAPPDATA 'Convert Wheel'
          $newDir = Join-Path $env:LOCALAPPDATA 'Pirouette'
          $keep = Join-Path $env:APPDATA 'local.convertwheel\settings.json'
          $moved = Join-Path $env:APPDATA 'io.github.oracola91.pirouette\settings.json'
          function Check($ok, $what) { if (-not $ok) { throw "FAILED: $what" } else { "ok: $what" } }
          foreach ($mode in @('/S /UPDATE', '/S')) {
            "== new installer with $mode"
            Start-Process $old -ArgumentList '/S' -Wait
            Check (Test-Path "$oldDir\convert-wheel.exe") 'old copy installed'
            New-ItemProperty -Path $run -Name 'Convert Wheel' -Value "`"$oldDir\convert-wheel.exe`"" -Force | Out-Null
            New-Item -ItemType Directory -Force (Split-Path $keep) | Out-Null
            Set-Content $keep '{"save_to":"downloads"}'
            Start-Process $new -ArgumentList $mode -Wait
            Check (Test-Path "$newDir\pirouette.exe") 'new copy in the Pirouette folder'
            Check (-not (Test-Path $oldDir)) 'old folder gone'
            Check (-not (Test-Path "$uninst\Convert Wheel")) 'old uninstall entry gone'
            Check (Test-Path "$uninst\Pirouette") 'new uninstall entry'
            Check (Test-Path "$menu\Pirouette.lnk") 'Start menu entry under the new name'
            Check (-not (Test-Path "$menu\Convert Wheel.lnk")) 'old Start menu entry gone'
            Check ((Get-ItemProperty $run).'Pirouette' -eq "`"$newDir\pirouette.exe`"") 'Open at Login under the new name'
            Check ($null -eq (Get-ItemProperty $run).'Convert Wheel') 'old Open at Login value gone'
            Check ((Test-Path $keep) -or (Test-Path $moved)) 'settings kept'
            Start-Process "$newDir\uninstall.exe" -ArgumentList '/S', "_?=$newDir" -Wait
            Remove-Item -Recurse -Force $newDir -ErrorAction SilentlyContinue
            Check ($null -eq (Get-ItemProperty $run).'Pirouette') 'uninstall takes Open at Login away'
          }

  linux:
    if: github.event_name == 'push' || inputs.platform != 'windows'
    # The oldest supported Ubuntu, so the AppImage also runs on older systems.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"; exit 1; }

      - name: Install the system libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1

      # Not for release builds: a cache from a branch build must not end up in a release.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name != 'push'
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: npm ci --ignore-scripts

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build the packages
        run: npx --no-install tauri build --bundles deb,appimage -- --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pirouette-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

      # Up to 0.3.x the package and program had another name (src-tauri/src/migrate.rs);
      # this one (pirouette) must replace it when dpkg installs it, as the app's own
      # updater does.
      - name: Check the move from 0.2.1 to this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download v0.2.1 -R "$GITHUB_REPOSITORY" -p 'Convert.Wheel_0.2.1_amd64.deb' -D old
          sudo apt-get install -y --no-install-recommends ./old/Convert.Wheel_0.2.1_amd64.deb
          dpkg-query -W convert-wheel
          sudo dpkg -i src-tauri/target/release/bundle/deb/*.deb
          [ "$(dpkg-query -W -f='${Status}' pirouette)" = "install ok installed" ]
          if dpkg-query -W -f='${Status}' convert-wheel 2>/dev/null | grep -q 'ok installed'; then
            echo "FAILED: convert-wheel is still installed"; exit 1
          fi
          [ -x /usr/bin/pirouette ]
          [ ! -e /usr/bin/convert-wheel ]
          [ -f /usr/share/applications/Pirouette.desktop ]
          [ ! -e "/usr/share/applications/Convert Wheel.desktop" ]
          echo "ok: pirouette replaced convert-wheel"

  # Reports known vulnerabilities in the Rust dependencies; doesn't block a build.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit
      - name: Check the dependencies against the RustSec advisory database
        run: cargo audit --file src-tauri/Cargo.lock

  release:
    if: github.event_name == 'push'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The signing key is an environment secret that only v* tags can reach.
    environment: release
    permissions:
      # The only job that may write: it creates the release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the Tauri CLI (for signing)
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: built

      - name: Collect the installers
        run: |
          mkdir release
          find built -type f -exec mv {} release/ \;
          # GitHub turns spaces in file names into dots on upload; do it first so the
          # checksums and update links match the names people download.
          for f in release/*; do
            case "$f" in *" "*) mv -- "$f" "${f// /.}" ;; esac
          done
          ls -l release

      # The only step that sees the key. The signature records the version, which the
      # app checks against latest.json, so an older build can't be relabelled as newer.
      - name: Sign the update files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir sigs
          for f in release/*.exe release/*.msi release/*.AppImage release/*.deb; do
            npx --no-install tauri signer sign --app-version "$version" "$f" > /dev/null
            mv "$f.sig" sigs/
          done
          ls sigs

      - name: Write the update manifest and the checksums
        env:
          REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" "$REPO" "$GITHUB_REF_NAME" <<'PY'
          import json, os, sys, datetime
          version, repo, tag = sys.argv[1:4]
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          def entry(name):
              sig = os.path.join("sigs", name + ".sig")
              if not os.path.exists(os.path.join("release", name)) or not os.path.exists(sig):
                  return None
              return {"url": base + name, "signature": open(sig).read().strip()}
          files = {
              "windows-x86_64-nsis": f"Pirouette_{version}_x64-setup.exe",
              "windows-x86_64-msi": f"Pirouette_{version}_x64_en-US.msi",
              "linux-x86_64-appimage": f"Pirouette_{version}_amd64.AppImage",
              "linux-x86_64-deb": f"Pirouette_{version}_amd64.deb",
          }
          platforms = {key: e for key, name in files.items() if (e := entry(name))}
          # Fallbacks for copies the updater can't tell the install type of.
          for plain, preferred in (("windows-x86_64", "windows-x86_64-nsis"), ("linux-x86_64", "linux-x86_64-appimage")):
              if preferred in platforms:
                  platforms[plain] = platforms[preferred]
          missing = [k for k in files if k not in platforms]
          if missing:
              sys.exit(f"no signed update file for: {', '.join(missing)}")
          manifest = {
              "version": version,
              "notes": f"Pirouette {version}. See https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          json.dump(manifest, open("release/latest.json", "w"), indent=2)
          print(json.dumps(sorted(platforms), indent=1))
          PY
          cd release
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          Pirouette $version. Updating a Linux .deb from 0.3.x: start Pirouette once from the app menu afterwards. Install steps for each system are in [INSTALL.md](https://github.com/$REPO/blob/$GITHUB_REF_NAME/INSTALL.md). Copies from 0.1.1 on update themselves: they find this release through \`latest.json\`.

          | System | File |
          |---|---|
          | Windows, one user, no admin | \`Pirouette_${version}_x64-setup.exe\` |
          | Windows, all users | \`Pirouette_${version}_x64_en-US.msi\` |
          | Ubuntu, Debian | \`Pirouette_${version}_amd64.deb\` |
          | Other Linux | \`Pirouette_${version}_amd64.AppImage\` |
          | macOS (Apple silicon) | \`Pirouette_${version}_aarch64.dmg\` |

          The installers are not code-signed (a personal project; INSTALL.md, *Why the files aren't signed*, says how to open a checked file). Updates are signed with the project's update key, with the version recorded in the signature, and the app refuses an update that doesn't match. SHA256SUMS.txt lists the files' checksums.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* --repo "$REPO" --draft --title "Pirouette $version" --notes-file notes.md
