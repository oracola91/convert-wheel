# Builds the Windows installer and the Linux packages. Started by hand only
# (Actions > Build > Run workflow, or `gh workflow run build.yml -f platform=linux`),
# so it spends build minutes only when asked.
# Actions are pinned to exact commits; the comment names the release.
name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which system to build for
        type: choice
        options: [both, windows, linux]
        default: both

permissions:
  contents: read

jobs:
  windows:
    if: inputs.platform != 'linux'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: npm ci --ignore-scripts

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: convert-wheel-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

  linux:
    if: inputs.platform != 'windows'
    # The oldest supported Ubuntu, so the AppImage also runs on older systems.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the system libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: npm ci --ignore-scripts

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build the packages
        run: npx tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: convert-wheel-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

