# Builds the Windows installer. Started by hand only (Actions > Build > Run workflow,
# or `gh workflow run build.yml`), so it spends build minutes only when asked.
# Actions are pinned to exact commits; the comment names the release.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: npm ci --ignore-scripts

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: convert-wheel-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
