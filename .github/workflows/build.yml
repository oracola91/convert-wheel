# Builds the Windows installers and the Linux packages.
#
# - Pushing a version tag (v0.2.0, ...) builds both and publishes a GitHub Release
#   with every installer attached, plus latest.json: the file the app's updater reads.
#   The tag must match the version in tauri.conf.json. The macOS .dmg and update file
#   are added afterwards from a Mac: scripts/release-macos.sh.
# - Update files are signed with the project's update key (repository secrets); the
#   app checks that signature before it installs anything.
# - Actions > Build > Run workflow (or `gh workflow run build.yml -f platform=linux`)
#   builds without releasing; the files stay on the run page for 14 days.
#
# Nothing runs on ordinary pushes, so build minutes are spent only when asked.
# Actions are pinned to exact commits; the comment names the release. All of them
# run on Node.js 24 (GitHub retired Node.js 20 for actions).
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Which system to build for
        type: choice
        options: [both, windows, linux]
        default: both

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name == 'push' || inputs.platform != 'linux'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: npm ci --ignore-scripts

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked

      # The .exe installs for the signed-in user without admin rights; the .msi installs
      # for all users in Program Files, the form Intune and other management tools expect.
      - name: Build the installers
        run: npx tauri build --bundles nsis,msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: convert-wheel-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
          retention-days: 14

  linux:
    if: github.event_name == 'push' || inputs.platform != 'windows'
    # The oldest supported Ubuntu, so the AppImage also runs on older systems.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"; exit 1; }

      - name: Install the system libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: npm ci --ignore-scripts

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build the packages
        run: npx tauri build --bundles deb,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: convert-wheel-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
          retention-days: 14

  release:
    if: github.event_name == 'push'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The only job that may write: it creates the release.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: built

      - name: Collect the installers, the update manifest and the checksums
        env:
          REPO: ${{ github.repository }}
        run: |
          mkdir release sigs
          find built -type f -name '*.sig' -exec mv {} sigs/ \;
          find built -type f -exec mv {} release/ \;
          # GitHub turns spaces in file names into dots on upload; do it first so the
          # checksums and update links match the names people download.
          for dir in release sigs; do
            for f in "$dir"/*; do
              case "$f" in *" "*) mv -- "$f" "${f// /.}" ;; esac
            done
          done
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" "$REPO" "$GITHUB_REF_NAME" <<'PY'
          import json, os, sys, datetime
          version, repo, tag = sys.argv[1:4]
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          def entry(name):
              sig = os.path.join("sigs", name + ".sig")
              if not os.path.exists(os.path.join("release", name)) or not os.path.exists(sig):
                  return None
              return {"url": base + name, "signature": open(sig).read().strip()}
          files = {
              "windows-x86_64-nsis": f"Convert.Wheel_{version}_x64-setup.exe",
              "windows-x86_64-msi": f"Convert.Wheel_{version}_x64_en-US.msi",
              "linux-x86_64-appimage": f"Convert.Wheel_{version}_amd64.AppImage",
              "linux-x86_64-deb": f"Convert.Wheel_{version}_amd64.deb",
          }
          platforms = {key: e for key, name in files.items() if (e := entry(name))}
          # Fallbacks for copies the updater can't tell the install type of.
          for plain, preferred in (("windows-x86_64", "windows-x86_64-nsis"), ("linux-x86_64", "linux-x86_64-appimage")):
              if preferred in platforms:
                  platforms[plain] = platforms[preferred]
          # A .deb update needs a signed .deb; the others must always be there.
          missing = [k for k in files if k not in platforms and k != "linux-x86_64-deb"]
          if missing:
              sys.exit(f"no signed update file for: {', '.join(missing)}")
          manifest = {
              "version": version,
              "notes": f"Convert Wheel {version}. See https://github.com/{repo}/releases/tag/{tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          json.dump(manifest, open("release/latest.json", "w"), indent=2)
          print(json.dumps(sorted(platforms), indent=1))
          PY
          cd release
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          Convert Wheel $version. Install steps for each system are in [INSTALL.md](https://github.com/$REPO/blob/$GITHUB_REF_NAME/INSTALL.md). Installed copies from 0.1.1 on update themselves: they find this release through \`latest.json\`.

          | System | File |
          |---|---|
          | Windows, one user, no admin | \`Convert.Wheel_${version}_x64-setup.exe\` |
          | Windows, all users | \`Convert.Wheel_${version}_x64_en-US.msi\` |
          | Ubuntu, Debian | \`Convert.Wheel_${version}_amd64.deb\` |
          | Other Linux | \`Convert.Wheel_${version}_amd64.AppImage\` |
          | macOS (Apple silicon) | \`Convert.Wheel_${version}_aarch64.dmg\`, added from a Mac after the build |

          The installers are not code-signed yet. Updates are signed with the project's update key, and the app refuses an update whose signature doesn't match. SHA256SUMS.txt lists the files' checksums.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* --repo "$REPO" --title "Convert Wheel $version" --notes-file notes.md
