# Runs the unit tests on Linux, Windows and macOS for every pull request, and again
# once it is merged into main. A pull request can only be merged when all three pass
# (the "Main branch" ruleset requires these checks).
#
# Nothing here can publish or sign: the token is read-only and no secrets are used,
# so pull requests from forks run safely too (GitHub asks before running a first-time
# contributor's). Actions are pinned to exact commits, the same as in build.yml.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # MuPDF too, so the PDF test converts a real file (it skips where mutool is missing).
      - name: Install the system libraries Tauri builds against, and MuPDF
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev mupdf-tools

      - name: Install MuPDF
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install mupdf-tools

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1

      # Test builds only: release builds in build.yml never restore a cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Unit tests
        working-directory: src-tauri
        env:
          # Linux and macOS have MuPDF (above), so the PDF test must really run there.
          REQUIRE_MUTOOL: ${{ runner.os != 'Windows' && '1' || '' }}
        run: cargo test --locked
