[package]
name = "convert-wheel"
version = "0.2.0"
description = "Hold Shift while dragging a file to pick a format to convert it to"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-notification = "=2.7.0"
# Without the "zip" feature: our updates are the installers themselves, never zip
# archives, and the zip crate it pulls in has open advisories (RUSTSEC-2026-0367..0369).
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-single-instance = "=2.5.4"
tempfile = "3.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSURL", "NSGeometry", "block2"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
objc2-app-kit = { version = "0.3", features = ["NSAnimation", "NSAnimationContext", "NSBezierPath", "NSCell", "NSColor", "NSControl", "NSDragging", "NSDraggingItem", "NSEvent", "NSGraphics", "NSHapticFeedback", "NSImage", "NSImageCell", "NSImageView", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSScreen", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "block2"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
webkit2gtk = "2.0"
x11rb = "0.14"
