[package]
name = "pirouette"
version = "0.3.0"
description = "Hold Shift while dragging a file to pick a format to convert it to"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-notification = "=2.7.0"
# Without the "zip" feature: our updates are the installers themselves, never zip
# archives, and the zip crate it pulls in has open advisories (RUSTSEC-2026-0367..0369).
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-single-instance = "=2.5.4"
tempfile = "3.27"
# Plain .gz files (one file, not a TAR); already in the build through Tauri.
flate2 = "1"
# Reads QR codes for the Tools wheel; pure Rust, no system library.
# Without its "img" feature: ImageMagick reads the picture, so no image decoders here.
rqrr = { version = "0.11", default-features = false }
# The editor's picture goes to its page as a data: URL; already in the build through Tauri.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "=2.8.3"
# Traces a picture into an SVG (convert/svg.rs). Pure Rust, no image decoding or file
# access of its own (ImageMagick reads the picture); only visioncortex and flo_curves
# come with it. Pinned: a 1.0 pre-release, chosen over 0.6 which drags in clap 2 and an
# old image crate.
vtracer = "=1.0.0-alpha.4"
# Draws SVG pictures for conversion (convert.rs, svg_to_png): pure Rust, in the app, so
# no outside SVG reader runs. External files an SVG points to are never read. Pinned.
resvg = "=0.49.0"
# Reads Finder's text clippings (property lists, convert.rs); Tauri already uses it.
plist = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# The folder picker as its own window (transfer.rs); the version the dialog plugin uses.
rfd = { version = "=0.16.0", default-features = false }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSURL", "NSGeometry", "NSNotification", "NSOperation", "block2"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
objc2-quick-look-thumbnailing = { version = "0.3", features = ["QLThumbnailGenerator", "QLThumbnailGenerationRequest", "QLThumbnailRepresentation", "block2", "objc2-app-kit"] }
objc2-user-notifications = { version = "0.3", features = ["UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSAccessibility", "NSAnimation", "NSAnimationContext", "NSApplication", "NSBezierPath", "NSBitmapImageRep", "NSButton", "NSCell", "NSColor", "NSControl", "NSCursor", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFont", "NSGlassEffectView", "NSGraphics", "NSHapticFeedback", "NSImage", "NSImageCell", "NSImageRep", "NSImageView", "NSMenu", "NSMenuItem", "NSPanel", "NSParagraphStyle", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSScreen", "NSSharingService", "NSSlider", "NSStatusBarButton", "NSStatusItem", "NSText", "NSTextField", "NSTrackingArea", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "block2"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
# The stock IIterable for the share sheet; already in the build through windows.
windows-collections = "0.3"
# PNG for the hub picture; already in the build through tauri's image-png.
png = "0.18"
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "Storage",
    "Storage_Streams",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
webkit2gtk = "2.0"
x11rb = "0.14"
# Already in the build through the single-instance plugin; here for the file
# manager's ShowItems call.
zbus = "5"

[dev-dependencies]
# Makes QR codes for the tests to read back.
qrcode = { version = "0.14", default-features = false }
